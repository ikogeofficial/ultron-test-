<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1011">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ikoge Focus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">

  <header class="top">
    <div class="brand">Ikoge<span>Focus</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="fsBtn" aria-label="Full screen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="setBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- TIMER -->
  <section class="card timer">
    <svg class="dial" viewBox="0 0 320 320" aria-hidden="true">
      <circle cx="160" cy="160" r="128" class="track"/>
      <g id="ticks"></g>
      <circle id="ring" class="arc" cx="160" cy="160" r="128" transform="rotate(-90 160 160)"/>
      <circle id="knob" class="knob-halo" cx="160" cy="32" r="17"/>
    </svg>
    <div class="readout" role="timer" aria-live="off">
      <div id="modeLabel" class="mode">FOCUS</div>
      <div id="time" class="time">25:00</div>
      <div id="cycleTxt" class="cycle">Session 1 of 4</div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab on" data-m="focus">Focus</button>
      <button class="tab" data-m="short">Short Break</button>
      <button class="tab" data-m="long">Long Break</button>
    </div>

    <div class="btnrow">
      <button class="btn primary" id="startBtn">Start</button>
      <button class="btn" id="resetBtn">Reset</button>
    </div>

    <div class="chips" id="chips">
      <button class="chip" data-min="15">15 Min</button>
      <button class="chip" data-min="25">25 Min</button>
      <button class="chip" data-min="45">45 Min</button>
      <button class="chip" data-min="60">60 Min</button>
      <button class="chip" data-min="90">90 Min</button>
    </div>
  </section>

  <!-- STREAK -->
  <section class="card streak" aria-label="Streak">
    <div class="streak-head">
      <div class="flame" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="46" height="46">
          <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a7a"/><stop offset="1" stop-color="#ff2f63"/></linearGradient></defs>
          <path fill="url(#fg)" d="M24 3c1.5 6.5 9 9.5 11.5 16.5C38 26.5 34 38 24 41c-10-3-14-14.5-11.5-21.5.9-2.5 2.4-4.4 4.3-6.2.3 3 1.7 5 3.5 6C19.200 13 20.500 7.500 24 3z"/>
          <path fill="#fff" d="M24 23c1.600 2.600 4.500 4.300 4.500 8a4.500 4.500 0 0 1-9 0c0-3.700 2.900-5.400 4.500-8z"/>
        </svg>
      </div>
      <div class="streak-t">
        <div class="lbl">STREAK</div>
        <div class="big"><span id="streakNum">0</span> <small>DAYS</small></div>
      </div>
      <div class="foot" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
    </div>
    <div class="week" id="week"></div>
    <div class="goal">
      <div class="lbl">TODAY'S FOCUS</div>
      <div class="goal-row">
        <div class="goal-num" id="goalTxt">0<small>/120 min</small></div>
        <div class="goal-pct" id="goalPct">0%</div>
      </div>
      <div class="bar"><i id="goalBar"></i></div>
    </div>
  </section>

  <!-- SOUNDS -->
  <section class="card sounds">
    <div class="sec-h">Ambient</div>
    <div class="chips amb" id="amb">
      <button class="chip" data-k="light">Light Rain</button>
      <button class="chip" data-k="heavy">Heavy Rain</button>
      <button class="chip" data-k="brown">Deep Hum</button>
    </div>
    <label class="slider"><span>Volume</span><input id="ambVol" type="range" min="0" max="1" step="0.05" value="0.6"></label>

    <div class="sep"></div>

    <div class="sec-h">FM Radio</div>
    <div class="radio-row">
      <select id="radioSel" aria-label="Station">
        <option value="https://ice1.somafm.com/groovesalad-128-mp3">Groove Salad (chill)</option>
        <option value="https://ice1.somafm.com/dronezone-128-mp3">Drone Zone (deep focus)</option>
        <option value="https://ice1.somafm.com/deepspaceone-128-mp3">Deep Space One</option>
        <option value="https://stream.radioparadise.com/mp3-128">Radio Paradise</option>
        <option value="custom">Custom stream link...</option>
      </select>
      <button class="btn primary sm" id="radioBtn">Play</button>
    </div>
    <input id="radioUrl" class="field" type="url" inputmode="url" placeholder="Paste a station stream link (https://...)" hidden>
    <label class="slider"><span>Volume</span><input id="radioVol" type="range" min="0" max="1" step="0.05" value="0.7"></label>
    <div class="note" id="radioStatus">Stopped</div>

    <div class="sep"></div>

    <div class="sec-h">Spotify</div>
    <div class="radio-row">
      <input id="spUrl" class="field" type="url" inputmode="url" placeholder="Paste a Spotify playlist, album or track link">
      <button class="btn primary sm" id="spLoad">Load</button>
    </div>
    <div class="note" id="spMsg"></div>
    <iframe id="spFrame" title="Spotify player" width="100%" height="152" frameborder="0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    <a id="spOpen" class="link" href="https://open.spotify.com" target="_blank" rel="noopener">Open in Spotify app</a>
  </section>

  <footer class="foot-note">Built by Ikogetech</footer>
</main>

<dialog id="dlg">
  <form method="dialog" class="dlg-body" onsubmit="return false">
    <h2>Settings</h2>
    <label>Focus (min)<input id="sFocus" type="number" min="1" max="180" inputmode="numeric"></label>
    <label>Short break (min)<input id="sShort" type="number" min="1" max="60" inputmode="numeric"></label>
    <label>Long break (min)<input id="sLong" type="number" min="1" max="90" inputmode="numeric"></label>
    <label>Long break every (sessions)<input id="sEvery" type="number" min="2" max="8" inputmode="numeric"></label>
    <label>Daily focus goal (min)<input id="sGoal" type="number" min="10" max="600" inputmode="numeric"></label>
    <label class="check"><input id="sAuto" type="checkbox"> Auto-start next session</label>
    <label class="check"><input id="sAwake" type="checkbox"> Keep screen on while running</label>
    <div class="dlg-btns">
      <button type="button" class="btn" id="sCancel">Cancel</button>
      <button type="button" class="btn primary" id="sSave">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
