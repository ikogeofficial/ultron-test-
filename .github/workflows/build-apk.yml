name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_FILE: ${{ runner.temp }}/ikoge.jks
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          {
            set -e
            test -n "$KS_PASS" || { echo "SECRET KS_PASS IS EMPTY"; exit 1; }
            echo "== decode key"
            base64 -d signing/ikoge.jks.b64 > "$KS_FILE"
            keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" | tail -2
            echo "== npm install"
            npm install --no-audit --no-fund
            echo "== copy web files"
            mkdir www
            tar --exclude=./node_modules --exclude=./android --exclude=./www --exclude=./scripts --exclude=./signing --exclude=./docs --exclude=./supabase --exclude=./worker --exclude=./.github --exclude=./package.json --exclude=./package-lock.json --exclude=./capacitor.config.json --exclude=./README.md -cf - . | tar -xf - -C www
            echo "== capacitor"
            npx cap add android
            npx cap sync android
            node scripts/patch-android.js
            echo "== gradle"
            cd android
            ./gradlew assembleRelease --no-daemon --stacktrace
            cd ..
            find android -name "*.apk"
            cp android/app/build/outputs/apk/release/app-release.apk Ikoge-Ultron.apk
            echo "== BUILD OK"
          } 2>&1 | tee build.log
      - name: Save build log to the build-logs branch
        if: always()
        shell: bash
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          tail -n 300 build.log > "$RUNNER_TEMP/log.txt" || echo "no log" > "$RUNNER_TEMP/log.txt"
          if [ -n "$KS_PASS" ]; then sed -i "s|$KS_PASS|***|g" "$RUNNER_TEMP/log.txt"; fi
          echo "RESULT: ${{ steps.build.outcome }}" >> "$RUNNER_TEMP/log.txt"
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git switch --orphan build-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP/log.txt" build-log.txt
          git add build-log.txt
          git commit -m "build log run ${{ github.run_number }}"
          git push -f origin build-logs
      - name: Stop here if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ikoge Ultron APK ${{ github.run_number }}
          files: Ikoge-Ultron.apk
