name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Check signing key
        env: { KS: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "Secret KEYSTORE_B64 is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ikoge.jks"
      - run: npm install --no-audit --no-fund
      - name: Copy web files into www
        run: |
          mkdir www
          tar --exclude=./node_modules --exclude=./android --exclude=./www --exclude=./scripts --exclude=./supabase --exclude=./worker --exclude=./.github --exclude=./package.json --exclude=./package-lock.json --exclude=./capacitor.config.json --exclude=./README.md -cf - . | tar -xf - -C www
      - run: npx cap add android
      - run: npx cap sync android
      - name: Patch Android project
        env: { VERSION_CODE: "${{ github.run_number }}" }
        run: node scripts/patch-android.js
      - name: Build signed APK
        working-directory: android
        env:
          KS_FILE: ${{ runner.temp }}/ikoge.jks
          KS_PASS: ikoge-ultron-2026
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Ikoge-Ultron.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ikoge Ultron APK ${{ github.run_number }}
          files: Ikoge-Ultron.apk
